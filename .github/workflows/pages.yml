name: Deploy Goa Coastal Atlas to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Verify and prepare the PWA
        run: |
          echo "676ba08bf4399d734392614161ec7d3b8b78fa76c7845d90113a04efaea17d86  Goa_Coastal_Atlas_PWA.tar.gz" | sha256sum --check
          mkdir -p _site
          tar -xzf Goa_Coastal_Atlas_PWA.tar.gz --strip-components=1 -C _site
          test -f _site/index.html
          test -f _site/manifest.webmanifest
          test -f _site/sw.js
          cp coast-learning.css coast-learning.js _site/
          sed -i 's#</head>#<link rel="stylesheet" href="coast-learning.css"></head>#' _site/index.html
          sed -i 's#</body>#<script src="coast-learning.js"></script></body>#' _site/index.html
          touch _site/.nojekyll

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
